# analysis_catalog.yml
# Catálogo determinístico de análises individuais da v1.0.
# SQL, roteamento, parâmetros, resultados, narrativa e limitações permanecem
# centralizados neste arquivo para facilitar revisão e rastreabilidade.

schema_version: "1"
catalog_version: "1.0.0"
product_release: "v1.0.0"
catalog_id: efd_icms_ipi_individual_analyses
language: pt-BR

sped:
  type: EFD_ICMS_IPI
  supported_layouts: ["020"]

loader:
  apply_defaults_before_validation: true
  merge_strategy: recursive
  fail_on_unknown_keys: true
  fail_on_duplicate_analysis_ids: true

runtime:
  engine: duckdb
  execution_scope: single_file
  parameter_style: duckdb_named
  statement_type: select
  access_mode: read_only
  timeout_seconds: 30
  max_result_rows: 5000
  enforcement:
    require_single_file: true
    require_single_statement: true
    allowed_statement_roots: [SELECT, WITH]
    apply_result_row_limit_before_materialization: true
    apply_timeout_in_executor: true
  relation_contract:
    naming: lowercase_record_code
    examples: [c100, c170, c190, k230, "0150", "0200"]
    technical_columns:
      all: [file_id, record_id, record_code, record_level, source_line]
      hierarchical: [parent_record_id, parent_record_code]
    normalized_types:
      date: DATE
      monetary: "DECIMAL(18, 2)"
      quantity: "DECIMAL(18, 6)"
      integer: BIGINT
      code: VARCHAR
      description: VARCHAR
    empty_relation_policy: create_from_layout
    notes:
      - Relações conhecidas devem existir com seu schema mesmo quando não houver ocorrências no arquivo.
      - parent_record_id representa somente o pai estrutural direto obtido pelo nível e pela ordem da fonte.
      - Relações semânticas, como C170.COD_ITEM = 0200.COD_ITEM, são declaradas nas consultas.

defaults:
  version: "1.0.0"
  status: draft
  routing: {clarification_required: false}
  availability: {empty_result_is_valid: true}
  execution: {engine: duckdb, mode: read_only}
  result: {shape: table, row_limit: 5000}
  narrative:
    input:
      mode: summarized
      max_rows: 20
      include_total_count: true
      overflow_behavior: deterministic_summary
  privacy:
    default_mode: masked
    protected_targets: [llm_payload, checkpoint, logs]
    ui_default: masked
    raw_export_requires_explicit_action: true

parameter_definitions:
  period_start: &period_start
    {type: date, required: true, default_from: file_profile.period_start, label: Data inicial}
  period_end: &period_end
    {type: date, required: true, default_from: file_profile.period_end, label: Data final}

