# Contrato de cenários da POC do tax-reform-impact-simulator.
# Não é uma tabela normativa. Classificação e reduções vêm de rtc_service_rules.csv.
# Campos *_pct usam pontos percentuais (ex.: 9.0 = 9%).
# Campos *_share e *_factor usam frações entre 0 e 1.
#
# A NFS-e usa o padrão nacional XML v1.01. A direção da operação é derivada
# comparando fixture.company_cnpj com prestador/tomador. Cancelamentos são
# eventos separados e devem preservar o documento original no source trace.

